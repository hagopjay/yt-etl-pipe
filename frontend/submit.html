<!DOCTYPE html>
<!--
  submit.html — the human-in-the-loop entry point. Deliberately a single
  static file with no build step, no framework, no dependency on the
  rest of this project's Python toolchain: whoever submits a URL should
  be able to open this file directly (or host it as a single S3 object
  with static website hosting enabled) without running `npm install`.

  Points API_BASE at the `api_base_url` Terraform output.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YouTube Transcript Queue</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #1a1a2e; }
  input[type=text] { width: 100%; padding: 0.6rem; font-size: 1rem; box-sizing: border-box; }
  button { padding: 0.6rem 1.2rem; font-size: 1rem; margin-top: 0.5rem; cursor: pointer; }
  #status { margin-top: 1.5rem; padding: 1rem; border-radius: 6px; background: #f5f5f7; white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; display: none; }
  .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
  .badge.COMPLETED { background: #d1f7dd; color: #0a6b2f; }
  .badge.QUEUED, .badge.PROCESSING, .badge.TRANSCRIBING, .badge.AWAITING_REVIEW { background: #fff3cd; color: #856404; }
  .badge.NO_CAPTIONS, .badge.UNAVAILABLE, .badge.REJECTED, .badge.REVIEW_EXPIRED, .badge.BLOCKED_PERMANENTLY, .badge.TRANSCRIBE_FAILED { background: #f8d7da; color: #842029; }
</style>
</head>
<body>
  <h1>Submit a YouTube video for transcription</h1>
  <p>Paste a YouTube URL below. If the video has captions, they're pulled directly.
     If not (and ASR fallback is enabled), audio is transcribed automatically — low-confidence
     results are routed to a human reviewer before publishing.</p>

  <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..." />
  <button onclick="submitUrl()">Submit</button>

  <div id="status"></div>

<script>
  // Set this to the `api_base_url` Terraform output before use.
  const API_BASE = "https://REPLACE-ME.execute-api.us-east-1.amazonaws.com";

  let pollTimer = null;

  async function submitUrl() {
    const url = document.getElementById('url').value.trim();
    if (!url) return;

    const statusEl = document.getElementById('status');
    statusEl.style.display = 'block';
    statusEl.textContent = 'Submitting...';

    try {
      const resp = await fetch(`${API_BASE}/submissions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });
      const data = await resp.json();

      if (!resp.ok) {
        statusEl.textContent = `Error: ${data.error || 'unknown error'}`;
        return;
      }

      render(data);
      if (data.video_id) startPolling(data.video_id);
    } catch (e) {
      statusEl.textContent = `Network error: ${e.message}`;
    }
  }

  function render(data) {
    const statusEl = document.getElementById('status');
    const badge = `<span class="badge ${data.status}">${data.status}</span>`;
    statusEl.innerHTML = `video_id: ${data.video_id}\nstatus: ${badge}\n\n` + JSON.stringify(data, null, 2);
  }

  function startPolling(videoId) {
    if (pollTimer) clearInterval(pollTimer);
    // Polling, not a websocket/SSE push -- deliberately simple for a
    // human-paced workflow (a submission takes seconds to minutes to
    // hours depending on whether it needs ASR + human review; nobody is
    // staring at this tab waiting sub-second updates). 5s interval is a
    // reasonable balance of responsiveness vs. needless API Gateway
    // request volume for something this low-urgency.
    pollTimer = setInterval(async () => {
      const resp = await fetch(`${API_BASE}/submissions/${videoId}`);
      if (!resp.ok) return;
      const data = await resp.json();
      render(data);

      const terminal = ['COMPLETED', 'NO_CAPTIONS', 'UNAVAILABLE', 'REJECTED', 'REVIEW_EXPIRED', 'BLOCKED_PERMANENTLY', 'TRANSCRIBE_FAILED'];
      if (terminal.includes(data.status)) clearInterval(pollTimer);
    }, 5000);
  }
</script>
</body>
</html>
